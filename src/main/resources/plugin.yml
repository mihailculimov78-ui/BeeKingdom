name: BeeKingdom
version: 0.3.0
main: ru.beekingdom.BeeKingdomPlugin
api-version: '26.3'
author: BeeKingdom
website: https://papermc.io/
description: Приручение и управление пчёлами
commands:
  beekdom:
    description: Открыть управление пчёлами BeeKingdom
    usage: /beekdom
    permission: beekdom.use
permissions:
  beekdom.use:
    description: Использование BeeKingdom
    default: true
